{% extends "base.html" %}
{% block title %}Checkout — Bidy'S Store{% endblock %}
{% block content %}
<section class="container section">
  <h2>Checkout</h2>
  <div class="cart-layout">
    <form method="post" class="form-card">
      <h3>Data Pengiriman</h3>
      <label>Nama lengkap<input type="text" name="name" required placeholder="Nama penerima"></label>
      <label>No. WhatsApp<input type="tel" name="phone" required placeholder="08xxxxxxxxxx"></label>
      <label>Alamat lengkap<textarea name="address" rows="3" required placeholder="Jalan, nomor, kota, kode pos"></textarea></label>
      <label>Metode pembayaran
        <select name="payment">
          <option>Transfer Bank</option>
          <option>E-Wallet</option>
          <option>Bayar di Tempat (COD)</option>
        </select>
      </label>
      <button class="btn btn-block" type="submit">Buat Pesanan</button>
    </form>
    <aside class="summary">
      <h3>Pesananmu</h3>
      {% for it in items %}
      <div class="row"><span>{{ it.qty }}× {{ it.book.title }}</span><span>{{ it.subtotal|rupiah }}</span></div>
      {% endfor %}
      <div class="row total"><span>Total</span><span>{{ total|rupiah }}</span></div>
    </aside>
  </div>
</section>
{% endblock %}
