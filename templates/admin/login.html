{% extends "base.html" %}
{% block title %}Login Admin — Bidy'S Store{% endblock %}
{% block content %}
<section class="container section">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
        </div>
        <h2>Admin Login</h2>
        <p class="muted">Masuk untuk mengelola toko</p>
      </div>
      <form method="post">
        <label>Username<input type="text" name="username" required placeholder="admin" autofocus></label>
        <label>Password<input type="password" name="password" required placeholder="••••••••"></label>
        <button class="btn btn-block" type="submit">Masuk</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
