<article class="card">
  <a href="{{ url_for('detail', book_id=b.id) }}" class="cover {% if b.cover_image %}cover-has-img{% endif %}" style="--c1: {{ b.c1 }}; --c2: {{ b.c2 }};">
    {% if b.cover_image %}
    <img src="{{ url_for('static', filename='uploads/' + b.cover_image) }}" alt="{{ b.title }}" class="cover-img">
    {% else %}
    <span class="cover-cat">{{ b.category }}</span>
    <span class="cover-title">{{ b.title }}</span>
    <span class="cover-author">{{ b.author }}</span>
    {% endif %}
  </a>
  <div class="card-body">
    <h3><a href="{{ url_for('detail', book_id=b.id) }}">{{ b.title }}</a></h3>
    <p class="muted">{{ b.author }}</p>
    <div class="card-foot">
      <div>
        <div class="price">{{ b.price|rupiah }}</div>
        <div class="rating">★ {{ b.rating }}</div>
      </div>
      <form action="{{ url_for('cart_add', book_id=b.id) }}" method="post">
        <button class="btn btn-small" type="submit">+ Keranjang</button>
      </form>
    </div>
  </div>
</article>
